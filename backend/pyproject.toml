[project]
name = "delaba-app-backend"
version = "0.1.0"
description = "Backend for Delaba university assignments tracker web app."
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.18.4",
  "boto3>=1.42.77",
  "fastapi[standard]>=0.131.0",
  "fleep>=1.0.1",
  "openai>=2.32.0",
  "psycopg[binary]>=3.3.3",
  "pwdlib[argon2]>=0.3.0",
  "pydantic>=2.12.5",
  "pyjwt>=2.11.0",
  "sqlalchemy>=2.0.46",
  "sqlalchemy-orm>=1.2.10",
  "sqlalchemy-utils>=0.42.1",
  "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "faker>=40.11.1",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "time-machine>=3.2.0",
]
