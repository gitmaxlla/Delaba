services:
  backend:
    volumes:
      - type: bind
        source: ./backend/src/
        target: /backend/src/
    build:
      target: development
    environment:
      - DEV_MODE=1
    ports:
      - "8000:8000"

  frontend:
    volumes:
      - type: bind
        source: ./frontend/app/
        target: /frontend/app/
    ports:
      - "5173:5173"
    build:
      target: development

  mail-server:
    ports:
      - "8025:8025"
      - "1025:1025"

  object-storage:
    ports:
      - "9900:9000"
      - "9901:9001"