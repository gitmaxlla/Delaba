services:
  backend:
    volumes:
      - type: bind
        source: ./backend/src/
        target: /backend/src/
    build:
      target: DEVELOPMENT
    environment:
      - DEV_MODE=1
    ports:
      - "8000:8000"

  frontend:
    volumes:
      - type: bind
        source: ./frontend/app/
        target: /frontend/app/
    ports:
      - "5173:5173"
    build:
      target: DEVELOPMENT

  object-storage:
    ports:
      - "9000:9000"
      - "9001:9001"